# Run everything:  docker compose up --build
#   8000 FastAPI backend   3000 frontend   3001 aqua-exe   8100 Model Lab (ML dev page)
#
# Both services use the root Dockerfile, which installs backend/requirements.txt
# and ml/requirements.txt.

services:
  app:
    image: papertrade-app
    build: &app-build
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
      - "3000:3000"
      - "3001:3001"
    restart: unless-stopped

  # The ML Model Lab dev page (ml/lab/), on the same image. It runs only its own
  # server, so it doesn't start the backend, frontends or cloudflared tunnel.
  lab:
    image: papertrade-app
    build: *app-build
    command: ["uvicorn", "ml.lab.server:app", "--host", "0.0.0.0", "--port", "8100"]
    working_dir: /app
    ports:
      - "8100:8100"
    restart: unless-stopped
