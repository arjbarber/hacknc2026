# Server deployment: backend API, price feeds, news feed, and the frontend.
#
#   cp deploy/.env.example deploy/.env      # set PUBLIC_API_URL (and ports if needed)
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Secrets come from the repo-root .env (mounted read-only, never baked into images).
# Ports default to 8080 (backend) and 3000 (frontend) so they don't collide with
# anything already on 5000 / 8000.
name: papertrade

x-backend-image: &backend
  image: papertrade-backend
  volumes:
    - ../.env:/app/.env:ro
  restart: unless-stopped

services:
  # Only this service builds the image; feeds and news reuse it.
  backend:
    <<: *backend
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Live prices for crypto, stocks and forex -> ticks table.
  feeds:
    <<: *backend
    pull_policy: never
    depends_on: [backend]
    command: ["python", "ingest/run_all.py"]

  # Finnhub headlines scored by Gemini -> news table.
  news:
    <<: *backend
    pull_policy: never
    depends_on: [backend]
    command: ["python", "ingest/news_feed.py"]

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL in deploy/.env (the backend address browsers use)}
    image: papertrade-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
