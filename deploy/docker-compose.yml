# Server deployment. By default this runs ONLY the backend:
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Optional extras, only if this server should also run them (profiles):
#   --profile feeds      live crypto/stock/forex prices -> ticks table
#   --profile news       Finnhub + Gemini headlines -> news table
#   --profile frontend   the web app (needs PUBLIC_API_URL in deploy/.env)
#   e.g. docker compose -f deploy/docker-compose.yml --profile feeds --profile news up -d --build
#
# Secrets come from the repo-root .env (mounted read-only, never baked into images).
# BACKEND_PORT defaults to 8080 so it doesn't collide with anything already on 8000.
name: papertrade

x-backend-image: &backend
  image: papertrade-backend
  volumes:
    - ../.env:/app/.env:ro
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # Only this service builds the image; the optional feeds reuse it.
  backend:
    <<: *backend
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8080}:8000"

  feeds:
    <<: *backend
    profiles: ["feeds"]
    pull_policy: never
    depends_on: [backend]
    command: ["python", "ingest/run_all.py"]

  news:
    <<: *backend
    profiles: ["news"]
    pull_policy: never
    depends_on: [backend]
    command: ["python", "ingest/news_feed.py"]

  frontend:
    profiles: ["frontend"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-}
    image: papertrade-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
